# ===========================================
# RAG-Local 設定ファイル
# ===========================================
# 運用で調整する可能性のある設定値を集約
# 機密情報（APIキー等）は .env に記載
#
# セクション構成:
#   common:     全プログラム共通設定
#   ui:         UI専用設定（streamlit）
#   batch:      バッチ処理専用設定（main.py）
#   evaluation: 改定影響調査専用設定（evaluate_revisions.py）

# ===========================================
# 共通設定（全プログラムで使用）
# ===========================================
common:
  # -------------------------------------------
  # 検索タイプ: hybrid | keyword_filter
  # hybrid: 類似検索（意味で探す）- ベクトル+キーワードのスコア計算
  # keyword_filter: キーワード必須（ワードを含むもののみ）
  # -------------------------------------------
  search_type: hybrid

  # ベクトル検索の重み（0.0-1.0）
  # 1.0に近いほど意味重視、0.0に近いほどワード重視
  # ※ search_type: hybrid の場合のみ有効
  vector_weight: 0.9

  # 検索モード: original | llm_enhanced | multi_stage
  # original: 原文検索（ベクトル+キーワード）
  # llm_enhanced: LLMでクエリを拡張して検索
  # multi_stage: 原文検索 + LLM拡張検索のOR結合
  search_mode: original

  # 検索対象: scenario | history_data
  search_source: history_data

  # -------------------------------------------
  # キーワード検索設定
  # -------------------------------------------
  keyword:
    # テキスト前半にあるキーワードの重み係数
    position_weight: 1.2
    # 除外する一般的な単語（ストップワード）
    stop_words:
      - こと
      - もの
      - これ
      - それ
      - ところ
      - 方
      - する
      - ある
      - いる
      - れる
      - られる
      - なる
      - その

  # -------------------------------------------
  # 列名候補（Excel自動検出用）
  # -------------------------------------------
  columns:
    query:
      - 分割後質問
      - 問合せ内容
      - 質問内容
      - 問い合わせ
      - 質問
      - query
      - Query
    answer:
      - 分割後回答
      - 回答
      - 既存回答
      - answer
      - Answer
    tag:
      - タグ付け
      - タグ
      - 分類
      - category
      - Category
      - tag
      - Tag
    correct_id:
      - 正解ID
      - 正解
      - CorrectID
      - Expected

# ===========================================
# UI専用設定（streamlit）
# ===========================================
ui:
  # 返却する類似文書数
  top_k: 3
  # 検索タイプ初期値: hybrid | keyword_filter
  search_type: hybrid
  # UIでのベクトル重み初期値（スライダーで動的変更可能）
  vector_weight: 0.9

# ===========================================
# バッチ処理専用設定（main.py）
# ===========================================
batch:
  # 返却する類似文書数
  top_k: 4

# ===========================================
# 改定影響調査専用設定（evaluate_revisions.py）
# ===========================================
# ※ commonセクションの設定は自動的に継承されます
evaluation:
  # 最大検索結果数
  max_results: 100

  # ベクトル検索の重み（commonから継承、明示的に指定）
  vector_weight: 0.9

  # LLM判断支援の有効化
  enable_judgment_support: true

  # 判断支援プロンプトファイル
  judgment_support_prompt: prompt/judgment_support.txt

  # -------------------------------------------
  # フィルタリングモード: threshold | top_k
  # threshold: 類似度の閾値でフィルタリング
  # top_k: 上位K件でフィルタリング（閾値は無視）
  # -------------------------------------------
  filter_mode: top_k

  # TOP-K件数（filter_mode: top_k の場合に使用）
  top_k: 130

  # -------------------------------------------
  # プロバイダー別閾値（類似度の足切り）
  # filter_mode: threshold の場合に使用
  # Azure: 高精度モデルのため低め、VertexAI: 汎用モデルのため高め
  # -------------------------------------------
  thresholds:
    azure_openai: 0.40
    vertex_ai: 0.50

  # -------------------------------------------
  # 改定番号とDBエリアの対応
  # areas: 検索対象のベクトルDBエリア
  # search_type: 検索タイプ
  #   hybrid: 類似検索（意味で探す）- ベクトルDB使用
  #   keyword_filter: キーワード必須（Excel直接検索）- ベクトルDB不使用
  # vector_weight: ベクトル検索の重み（0.0-1.0）※ hybrid 時のみ有効
  #   0.9: ベクトル重視（意味的類似性）
  #   0.3: キーワード重視（用語置換など）
  # -------------------------------------------
  revision_areas:
    "①":
      areas:
        - rev01_smile
      search_type: hybrid
      vector_weight: 0.9
    "②":
      areas:
        - rev02_souzoku
      search_type: hybrid
      vector_weight: 0.9
    "③":
      areas:
        - rev03_naibujimu
        - rev03_smile
        - rev03_souzoku
        - rev03_torikaku
      search_type: hybrid
      vector_weight: 0.9
    "④":
      areas:
        - rev04_naibujimu
      search_type: hybrid
      vector_weight: 0.9
    "⑤":
      areas:
        - rev05_smile
      search_type: keyword_filter
    "⑥":
      areas:
        - rev06_smile
      search_type: keyword_filter

  # -------------------------------------------
  # ボット名マッピング
  # -------------------------------------------
  area_to_bot:
    smile: smile-bot
    naibujimu: naibujimu-bot
    souzoku: souzoku-bot
    torikaku: torikaku-bot

  # -------------------------------------------
  # エリア名→日本語カテゴリ名マッピング
  # Excel出力の「カテゴリ」列に表示
  # -------------------------------------------
  area_to_category:
    smile: スマイルタブレット
    naibujimu: 内部事務
    souzoku: 相続
    torikaku: 取引時確認

  # -------------------------------------------
  # 改定番号・ボット・Lv1カテゴリ → ソースファイル名マッピング
  # 修正前フォルダの具体的なファイル名を特定するために使用
  # -------------------------------------------
  revision_source_files:
    "①":
      smile-bot:
        諸届: "①スマイル機能変更_修正前_シナリオ_スマイルタブレット_諸届_20250718 (1).xlsx"
    "②":
      souzoku-bot:
        預金: "②少額解約変更前_シナリオ_相続_預金_少額払い・簡易払い_20250213 (1).xlsx"
    "③":
      naibujimu-bot:
        喪失: "シナリオ_内部事務_喪失_20250718.xlsx"
        届出事項変更: "シナリオ_内部事務_届出事項変更_20250718.xlsx"
        預金: "シナリオ_内部事務_預金_普通預金・貯蓄預金_20250813.xlsx"
      souzoku-bot:
        預金: "シナリオ_相続_預金_少額払い・簡易払い_20250910.xlsx"
      torikaku-bot:
        取引時確認: "シナリオ_取引時確認_20250228.xlsx"
      smile-bot:
        取引時確認: "シナリオ_スマイルタブレット_取引時確認_20250718.xlsx"
        カード関連: "シナリオ_スマイルタブレット_カード関連_20250717.xlsx"
    "④":
      naibujimu-bot:
        預金: "シナリオ_内部事務_預金_普通預金・貯蓄預金_20250813.xlsx"
    "⑤":
      smile-bot:
        預金関連: "シナリオ_スマイルタブレット_預金関連_20250919.xlsx"
        喪失: "シナリオ_スマイルタブレット_喪失_20250731.xlsx"
    "⑥":
      smile-bot:
        諸届: "シナリオ_スマイルタブレット_諸届_20250919.xlsx"
