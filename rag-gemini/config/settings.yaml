# ===========================================
# RAG-Gemini 設定ファイル
# ===========================================
# 運用で調整する可能性のある設定値を集約
# 機密情報（APIキー等）は .env に記載
#
# セクション構成:
#   common:     全プログラム共通設定
#   ui:         UI専用設定（streamlit）
#   batch:      バッチ処理専用設定（main.py）
#   evaluation: 事務改定評価専用設定（evaluate_revisions.py）

# ===========================================
# 共通設定（全プログラムで使用）
# ===========================================
common:
  # ベクトル検索の重み（0.0-1.0）
  # 1.0に近いほどベクトル検索を重視、0.0に近いほどキーワード検索を重視
  vector_weight: 0.9

  # 検索モード: original | llm_enhanced | multi_stage
  search_mode: original

  # LLMクエリ拡張の有効化
  enable_query_enhancement: false

  # 検索対象: all | scenario | history_data
  search_source: all

  # -------------------------------------------
  # キーワード検索設定
  # -------------------------------------------
  keyword:
    # テキスト前半にあるキーワードの重み係数
    position_weight: 1.2
    # 除外する一般的な単語（ストップワード）
    stop_words:
      - こと
      - もの
      - これ
      - それ
      - ところ
      - 方
      - する
      - ある
      - いる
      - れる
      - られる
      - なる
      - その

  # -------------------------------------------
  # 列名候補（Excel自動検出用）
  # -------------------------------------------
  columns:
    query:
      - 分割後質問
      - 問合せ内容
      - 質問内容
      - 問い合わせ
      - 質問
      - query
      - Query
    answer:
      - 分割後回答
      - 回答
      - 既存回答
      - answer
      - Answer
    tag:
      - タグ付け
      - タグ
      - 分類
      - category
      - Category
      - tag
      - Tag
    correct_id:
      - 正解ID
      - 正解
      - CorrectID
      - Expected

# ===========================================
# UI専用設定（streamlit）
# ===========================================
ui:
  # 返却する類似文書数
  top_k: 3
  # UIでのベクトル重み初期値（スライダーで動的変更可能）
  vector_weight: 0.9

# ===========================================
# バッチ処理専用設定（main.py）
# ===========================================
batch:
  # 返却する類似文書数
  top_k: 4

# ===========================================
# 事務改定評価専用設定（evaluate_revisions.py）
# ===========================================
evaluation:
  # 最大検索結果数
  max_results: 100

  # LLM判断支援の有効化
  enable_judgment_support: true

  # 判断支援プロンプトファイル
  judgment_support_prompt: prompt/judgment_support.txt

  # -------------------------------------------
  # プロバイダー別閾値（類似度の足切り）
  # -------------------------------------------
  thresholds:
    azure_openai: 0.40
    vertex_ai: 0.50

  # -------------------------------------------
  # 改定番号とDBエリアの対応
  # -------------------------------------------
  revision_areas:
    "①":
      - rev01smile
    "②":
      - rev02souzoku
    "③":
      - rev03naibujimu
      - rev03smile
      - rev03souzoku
      - rev03torikaku
    "④":
      - rev04naibujimu
    "⑤":
      - rev05smile
    "⑥":
      - rev06smile

  # -------------------------------------------
  # ボット名マッピング
  # -------------------------------------------
  area_to_bot:
    smile: smile-bot
    naibujimu: naibujimu-bot
    souzoku: souzoku-bot
    torikaku: torikaku-bot
