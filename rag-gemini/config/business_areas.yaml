# 業務分野マッピング設定
# 日本語の業務分野名 → ChromaDB互換の英語名への変換

# 基本マッピング（完全一致を優先）
mappings:
  総則: general
  預金: deposit
  融資: loan
  外貨: foreign_currency
  投信: investment_trust
  住宅ローン: housing_loan
  投資信託: investment_fund
  カード: card
  保険: insurance
  年金: pension

# 事務改定用マッピング
revision_mappings:
  # ①スマイル機能変更（台帳No.20）
  rev01_smile: rev01_smile
  # ②相続少額払い（台帳No.21）
  rev02_souzoku: rev02_souzoku
  # ③保険証→資格確認証（台帳No.25-30, 35-36）
  rev03_smile: rev03_smile
  rev03_naibujimu: rev03_naibujimu
  rev03_souzoku: rev03_souzoku
  rev03_torikaku: rev03_torikaku
  # ④0円新規開設可能（台帳No.37）
  rev04_naibujimu: rev04_naibujimu
  # ⑤AML→GPLEX（台帳No.41-42）
  rev05_smile: rev05_smile
  # ⑥DC→MDC（台帳No.43-45）
  rev06_smile: rev06_smile

# ChromaDBコレクション名の制約
collection_constraints:
  min_length: 3
  max_length: 512
  # 許可される文字: [a-zA-Z0-9._-]
  # 先頭・末尾は英数字である必要がある

# デフォルト値
defaults:
  collection_name: default
  fallback_prefix: c
  fallback_suffix: c
